apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.farelevan.selfup.SelfUp
    intents:
    - metadata:
        name: LogExpenseIntent_0
        title: Log Expense
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Log an expense in ${+applicationName}'
          - '{${+prefix} }Track spending in ${+applicationName}'
    - metadata:
        name: CompleteHabitIntent_1
        title: Complete Habit
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Complete habit in ${+applicationName}'
          - '{${+prefix} }Check off habit in ${+applicationName}'
    - metadata:
        name: OpenSectionIntent_2
        title: Open SelfUp Section
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Open section in ${+applicationName}'
          - '{${+prefix} }Show tab in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - SelfUp
- name: HabitEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Habit
- name: AppDestination
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Today
    - Habits
    - Money
    - Tasks
    - Rewards
    - Insights
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
